#:schema node_modules/wrangler/config-schema.json

# ============================================================
# ARMANA PRODUCTION PLANNING SYSTEM
# Cloudflare Workers
# ============================================================

name = "buildup-planv2"

main = "src/server.ts"

compatibility_date = "2026-01-01"

compatibility_flags = ["nodejs_compat"]

# ============================================================
# STATIC ASSETS
# ============================================================

[assets]
directory = ".output/public"
binding = "ASSETS"

# ============================================================
# PRODUCTION ENVIRONMENT
# ============================================================

[vars]

ENVIRONMENT = "production"

APP_BASE_URL = "https://buildup-planv2.planning-armanabd.workers.dev"

ALLOWED_ORIGINS = "https://buildup-planv2.planning-armanabd.workers.dev"

# ============================================================
# PRODUCTION D1 DATABASE
# ============================================================

[[d1_databases]]

binding = "DB"

database_name = "armana-planning-prod"

database_id = "37277487-447f-4bb3-bca4-b7e107e89488"

migrations_dir = "migrations"

# ============================================================
# PRODUCTION R2 STORAGE
# ============================================================

[[r2_buckets]]

binding = "FILES"

bucket_name = "armana-planning-prod"

# ============================================================
# CUSTOM DOMAIN
# ============================================================
#
# Enable this only after the workers.dev deployment works.
#
# [[routes]]
# pattern = "capacity.armanagroup.com"
# custom_domain = true
#
# ============================================================
